name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare
        run: pnpm exec nuxt prepare

      - name: Test
        run: pnpm test

      - name: Write wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
          CLOUDFLARE_CRON: ${{ vars.CLOUDFLARE_CRON }}
        run: |
          node --input-type=module << 'JS'
          import { writeFileSync } from "node:fs";
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || "";
          const kvId = process.env.CLOUDFLARE_KV_NAMESPACE_ID || "";
          const bucket = process.env.CLOUDFLARE_R2_BUCKET_NAME || "";
          const domain = process.env.CLOUDFLARE_CUSTOM_DOMAIN || "";
          const cron = process.env.CLOUDFLARE_CRON || "";
          if (!accountId || !kvId || !bucket) {
            console.error("缺少 CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_KV_NAMESPACE_ID / CLOUDFLARE_R2_BUCKET_NAME");
            process.exit(1);
          }
          const config = {
            $schema: "node_modules/wrangler/config-schema.json",
            name: "folder",
            account_id: accountId,
            main: "./dist/server/index.mjs",
            compatibility_date: "2025-03-10",
            compatibility_flags: ["nodejs_compat"],
            observability: { enabled: true },
            kv_namespaces: [{ binding: "KV", id: kvId }],
            r2_buckets: [{ binding: "BLOB", bucket_name: bucket }],
            assets: { binding: "ASSETS", directory: "./dist/public" },
          };
          if (domain) config.routes = [{ pattern: domain, custom_domain: true }];
          // Cron triggers are opt-in: the Workers Free plan allows 5 per account,
          // so set the CLOUDFLARE_CRON repo variable only when one is free.
          if (cron) config.triggers = { crons: [cron] };
          writeFileSync("wrangler.jsonc", JSON.stringify(config, null, 2) + "\n");
          JS

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
